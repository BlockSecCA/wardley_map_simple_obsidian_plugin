<text x="485" y="371.3333333333333" text-anchor="middle" font-size="10" fill="#333" class="wardley-label wardley-pipeline-sub-label">NoSQL</text>
<circle cx="655" cy="353.3333333333333" r="6" fill="#96CEB4" stroke="#2F9E44" stroke-width="2" class="wardley-node wardley-pipeline-component wardley-stage-commodity"/>
<text x="655" y="371.3333333333333" text-anchor="middle" font-size="10" fill="#333" class="wardley-label wardley-pipeline-sub-label">Cloud DB</text>
</svg>