<circle cx="485" cy="206.66666666666666" r="8" fill="#45B7D1" stroke="#1971C2" stroke-width="2" class="wardley-node wardley-component wardley-stage-product"/>
<text x="485" y="193.66666666666666" text-anchor="middle" font-size="12" font-weight="bold" fill="#000" class="wardley-label">Service</text>
<circle cx="145" cy="353.3333333333333" r="6" fill="#FF6B6B" stroke="#C92A2A" stroke-width="2" class="wardley-node wardley-pipeline-component wardley-stage-genesis"/>
<text x="145" y="371.3333333333333" text-anchor="middle" font-size="10" fill="#333" class="wardley-label wardley-pipeline-sub-label">File Storage</text>
