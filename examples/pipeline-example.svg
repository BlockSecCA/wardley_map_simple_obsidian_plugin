<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" class="wardley-map">
<defs>
		<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
			<polygon points="0 0, 10 3.5, 0 7" fill="#4A90E2" />
		</marker>
		<marker id="arrowhead-evolution" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
			<polygon points="0 0, 10 3.5, 0 7" fill="#9B59B6" />
		</marker>
		<marker id="arrowhead-flow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
			<polygon points="0 0, 10 3.5, 0 7" fill="#E67E22" />
		</marker>
		<marker id="arrowhead-flow-start" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth">
			<polygon points="10 0, 0 3.5, 10 7" fill="#E67E22" />
		</marker>
	</defs>
<rect width="800" height="600" fill="white" class="wardley-background"/>
<line x1="145" y1="60" x2="145" y2="540" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" class="wardley-grid"/>
<text x="145" y="570" text-anchor="middle" font-size="11" fill="#666" class="wardley-stage-label">Genesis</text>
<line x1="315" y1="60" x2="315" y2="540" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" class="wardley-grid"/>
<text x="315" y="570" text-anchor="middle" font-size="11" fill="#666" class="wardley-stage-label">Custom Built</text>
<line x1="485" y1="60" x2="485" y2="540" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" class="wardley-grid"/>
<text x="485" y="570" text-anchor="middle" font-size="11" fill="#666" class="wardley-stage-label">Product</text>
<line x1="655" y1="60" x2="655" y2="540" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" class="wardley-grid"/>
<text x="655" y="570" text-anchor="middle" font-size="11" fill="#666" class="wardley-stage-label">Commodity</text>
<text x="400" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" class="wardley-axis-label">Evolution →</text>
