<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000" class="wardley-title">Database Evolution</text>
<line x1="321.0572538334335" y1="65.225866052374" x2="478.9427461665665" y2="201.44080061429264" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrowhead)" class="wardley-edge wardley-dependency"/>
<line x1="485" y1="214.66666666666666" x2="485" y2="345.3333333333333" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrowhead)" class="wardley-edge wardley-dependency"/>
<rect x="125" y="323.3333333333333" width="550" height="60" rx="6" ry="6" fill="#f8f8f8" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" class="wardley-pipeline"/>
<text x="400" y="317.3333333333333" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" class="wardley-pipeline-label">Database</text>
<circle cx="315" cy="60" r="8" fill="#4ECDC4" stroke="#0B7285" stroke-width="2" class="wardley-node wardley-anchor"/>
